services:
  - type: web
    name: hwy101marina
    runtime: python
    plan: starter            # free plans sleep after inactivity, which is wrong for a business site
    region: ohio
    branch: main
    autoDeploy: true         # auto-deploy on push to main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --threads 4 --timeout 30 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SITE_URL
        value: https://www.hwy101marina.com
      # Web3Forms access key. Public by design (it is embedded in the page). Paste it in the dashboard.
      - key: WEB3FORMS_ACCESS_KEY
        sync: false
      # Fallback contact form delivery through the Resend HTTP API. Set these in the Render dashboard.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false          # e.g. "101 Marina <noreply@hwy101marina.com>", must be a verified Resend domain
      - key: MAIL_TO
        sync: false          # comma separated list of inboxes that receive leads
